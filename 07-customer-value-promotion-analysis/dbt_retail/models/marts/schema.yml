version: 2

models:
  - name: fct_promotion_effectiveness
    columns:
      - name: household_key
        tests:
          - not_null
      - name: day
        tests:
          - not_null
      - name: sales_value
        tests:
          - not_null
      - name: basket_id
        tests:
          - not_null
      - name: is_coupon_redeemed
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_on_display
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
      - name: is_in_mailer
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false

  - name: dim_customer
    columns:
      - name: household_key
        tests:
          - not_null
          - unique
      - name: is_churned
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false